name: Top Picks API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-api.txt
      - run: python -m unittest -v test_api
        env:
          SAVE_RESPONSES: '1'
